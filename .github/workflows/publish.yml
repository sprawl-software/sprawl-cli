name: Publish to PyPI

on:
  release:
    types: [published] # This triggers the workflow when you publish a new GitHub Release

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # These permissions are required for Trusted Publishing to work
    permissions:
      id-token: write  
      contents: read
      
    environment:
      name: pypi
      url: https://pypi.org/p/sprawl-cli # Replace sprawl-cli with your exact package name if different
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

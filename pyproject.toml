[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprawl-cli"
version = "2.0.3"
description = "Sprawl CLI Orchestrator - A single-pane Zero-Trust Agentic Fabric execution utility"
authors = [
    { name = "Younes Baghor", email = "younes@brainblendai.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0,<15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
license = { text = "BSL-1.1" }
keywords = ["sandbox", "agentic", "fabric", "mcp", "security", "governance"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "bandit>=1.7.0",
]

[project.urls]
Homepage = "https://sprawl.software"
Repository = "https://github.com/sprawl-software/sprawl-cli"
"Bug Tracker" = "https://github.com/sprawl-software/sprawl-cli/issues"


[project.scripts]
sprawl = "sprawl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.bandit]
# B404: subprocess import — unavoidable for a CLI orchestration tool.
# B603/B607: subprocess with list args (no shell=True) IS the secure pattern.
#   Sprawl intentionally calls system binaries (git, pipx, npm, cargo) via
#   list-form subprocess calls, which prevents shell injection by design.
# All skipped rules are Low severity and represent intentional design decisions.
skips = ["B404", "B603", "B607"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "test-sandbox",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bug patterns)
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (modern Python 3.10+ syntax)
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults (if needed for CLI defaults)
    "B904",  # Bare raise in except clause (clean user-facing CLI SprawlError output)
]

[tool.ruff.lint.isort]
known-first-party = ["sprawl"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
